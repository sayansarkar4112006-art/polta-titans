<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>Polta Titans 🏏</title>
<link rel="icon" id="favi"><link rel="apple-touch-icon" id="favi2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0d; --panel: #16161a; --panel2: #1e1e24; --line: #2e2e37;
    --text: #f3f1ea; --muted: #aaa69a; --green: #22c55e; --gold: #fdb802; --red: #ef4444;
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Hind Siliguri', system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: radial-gradient(1200px 600px at 50% -200px, #3a2c00 0%, var(--bg) 60%);
    color: var(--text); font-size: 16px;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  .app { max-width: 540px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
  header.top {
    position: sticky; top: 0; z-index: 5; padding: max(14px, env(safe-area-inset-top)) 16px 10px;
    background: linear-gradient(180deg, rgba(11,11,13,.97), rgba(11,11,13,.86)); backdrop-filter: blur(8px);
    display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line);
  }
  .logo { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 22px;
    background: linear-gradient(135deg, var(--gold), #e4891b); box-shadow: 0 4px 14px rgba(245,197,66,.35); }
  .brand { font-weight: 700; font-size: 20px; letter-spacing: .3px; }
  .brand small { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
  .demo-pill { margin-left: auto; font-size: 11px; padding: 4px 8px; border-radius: 99px; background: #3b2a06; color: var(--gold); border: 1px solid #6b4e10; }
  main { flex: 1; padding: 14px 14px 96px; }
  nav.tabs {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 6;
    display: flex; justify-content: center; background: rgba(14,14,17,.97); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav.tabs .inner { display: flex; width: 100%; max-width: 540px; }
  nav.tabs button { flex: 1; background: none; border: 0; padding: 9px 1px 10px; color: var(--muted); font-size: 11px; cursor: pointer; white-space: nowrap; }
  nav.tabs button .ic { display: block; font-size: 21px; line-height: 1.2; }
  nav.tabs button.on { color: var(--gold); }
  .card { background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
  .card h3 { margin: 0 0 10px; font-size: 17px; }
  .muted { color: var(--muted); font-size: 14px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .spacer { flex: 1; }
  .btn { border: 0; border-radius: 12px; padding: 11px 14px; font-weight: 600; cursor: pointer; background: var(--green); color: #052b14; }
  .btn.gold { background: linear-gradient(135deg, var(--gold), #e8a21c); color: #2b1a00; }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
  .btn.red { background: #3a1212; color: #ffb4b4; border: 1px solid #6a2020; }
  .btn.sm { padding: 7px 10px; font-size: 14px; border-radius: 10px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.block { width: 100%; }
  label.f { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input.in, select.in, textarea.in { width: 100%; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line); background: #0f0f12; outline: none; }
  input.in:focus, select.in:focus, textarea.in:focus { border-color: var(--green); }
  .avatar { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; flex: none; color: #072014; font-size: 18px; }
  .member { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .member:last-child { border-bottom: 0; }
  .member .nm { font-weight: 600; }
  .member .meta { font-size: 13px; color: var(--muted); }
  .rankb { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .coins { font-weight: 700; color: var(--gold); white-space: nowrap; }
  .pos { width: 22px; text-align: center; color: var(--muted); font-weight: 700; flex: none; }
  .shame { display: inline-flex; align-items: center; gap: 5px; margin-top: 4px; padding: 3px 10px 3px 6px; border-radius: 10px;
    background: #ffe14d; color: #3a1d00; font-weight: 700; font-size: 13px; transform: rotate(-3deg);
    box-shadow: 2px 2px 0 #b8860b; animation: wob 1.6s ease-in-out infinite; }
  .shame .st { font-size: 18px; display: inline-block; animation: spin 2.4s linear infinite; }
  @keyframes wob { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg) scale(1.04); } }
  @keyframes spin { 0%,100% { transform: rotate(0); } 50% { transform: rotate(20deg); } }
  .me-card { background: linear-gradient(135deg, #2b2200, #16161a 60%, #0e1630); }
  img.logoimg { width: 40px; height: 40px; border-radius: 12px; object-fit: cover; flex: none; box-shadow: 0 4px 14px rgba(253,184,2,.35); }
  img.crest { width: 42px; height: 42px; border-radius: 50%; object-fit: contain; flex: none; background: #0e1630; }
  .ownerb { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 99px; background: linear-gradient(135deg,#fdb802,#c98a00); color: #1a1200; margin-left: 4px; vertical-align: 2px; }
  .big { font-size: 30px; font-weight: 700; }
  .stat { flex: 1; background: rgba(0,0,0,.2); border-radius: 12px; padding: 10px; text-align: center; }
  .stat b { display: block; font-size: 20px; }
  .bar { height: 8px; border-radius: 99px; background: #0f0f12; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--green), var(--gold)); }
  .ladder { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 10px; }
  .ladder div { text-align: center; font-size: 10px; color: var(--muted); padding: 6px 0; border-radius: 10px; background: rgba(0,0,0,.2); }
  .ladder div.on { outline: 2px solid var(--gold); color: var(--text); }
  .ladder span { display: block; font-size: 18px; }
  .poll .opt { display: flex; gap: 8px; margin-top: 10px; }
  .poll .opt button { flex: 1; }
  .chip { display: inline-block; font-size: 12px; padding: 3px 8px; border-radius: 99px; background: #0f0f12; border: 1px solid var(--line); margin: 3px 3px 0 0; }
  .chip.yes { border-color: #1f7a42; color: #9df3bd; }
  .chip.no { border-color: #7a2a1f; color: #ffb4a8; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 99px; font-weight: 700; }
  .tag.open { background: #0e3d24; color: #7ef0ac; }
  .tag.closed { background: #2a2a2a; color: #ccc; }
  .chatlist .item { display: flex; gap: 10px; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .chatwrap { display: flex; flex-direction: column; height: calc(100vh - 180px); height: calc(100dvh - 180px); }
  .msgs { flex: 1; overflow-y: auto; padding: 6px 2px; display: flex; flex-direction: column; gap: 6px; }
  .bubble { max-width: 78%; padding: 8px 11px; border-radius: 14px; background: #183a29; align-self: flex-start; word-wrap: break-word; white-space: pre-wrap; }
  .bubble.mine { align-self: flex-end; background: #1d6b3f; }
  .bubble .who { font-size: 12px; font-weight: 700; color: var(--gold); }
  .bubble .tm { font-size: 10px; color: #b7d3c3; text-align: right; margin-top: 2px; }
  .composer { display: flex; gap: 8px; padding-top: 8px; }
  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #111; border: 1px solid #333; color: #fff;
    padding: 10px 14px; border-radius: 12px; z-index: 50; max-width: 90%; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--panel); width: 100%; max-width: 540px; max-height: 85vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 16px; border: 1px solid var(--line); }
  .check { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 1px solid var(--line); }
  .check input { width: 22px; height: 22px; accent-color: var(--green); }
  table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.t td, table.t th { padding: 7px 4px; border-bottom: 1px solid var(--line); text-align: left; }
  .center { text-align: center; }
  .hero { text-align: center; padding: 30px 10px 10px; }
  .hero .ball { font-size: 64px; }
  .loader { text-align: center; padding: 60px 0; color: var(--muted); }
  .seg { display: flex; background: #0f0f12; border-radius: 12px; padding: 4px; gap: 4px; margin-bottom: 12px; }
  .seg button { flex: 1; border: 0; background: none; padding: 8px; border-radius: 9px; cursor: pointer; color: var(--muted); }
  .seg button.on { background: var(--panel2); color: var(--text); }
</style>
</head>

const SHAME_BELOW_PCT = 10;
function coinsForPct(p) { return p >= 100 ? 50 : p >= 75 ? 30 : p >= 50 ? 15 : p >= 25 ? 5 : 0; }
const MVP_BONUS = 20;

/* ------------------------- helpers ------------------------- */
const $ = (s) => document.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.setAttribute("style", v);
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = !!v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(9)) {
    if (c === null || c === undefined || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}
function askConfirm(msg) {
  return new Promise((res) => {
    const done = (v) => { ov.remove(); res(v); };
    const ov = h("div", { class: "overlay confirm-ov" }, h("div", { class: "sheet" },
      h("p", { style: "font-size:17px;margin:4px 0 16px" }, msg),
      h("div", { class: "row" }, h("button", { class: "btn ghost", onclick: () => done(false) }, "না"),
        h("button", { class: "btn gold", style: "flex:1", onclick: () => done(true) }, "হ্যাঁ"))));
    document.body.append(ov);
  });
}
function toast(msg) {
  const t = h("div", { class: "toast" }, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), 3200);
}
const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
function addDays(s, n) { const d = new Date(s + "T00:00:00"); d.setDate(d.getDate() + n); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function weekKey(s) {
  const d = new Date(s + "T00:00:00");
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const y = t.getUTCFullYear();
  const w = Math.ceil(((t - Date.UTC(y, 0, 1)) / 86400000 + 1) / 7);
  return y + "-W" + String(w).padStart(2, "0");
}
const BN = "০১২৩৪৫৬৭৮৯";
const bn = (n) => String(n).replace(/\d/g, (d) => BN[d]);
function fmtDate(s) { const d = new Date(s + "T00:00:00"); return d.toLocaleDateString("bn-IN", { day: "numeric", month: "short", weekday: "short" }); }
function fmtTime(ms) { if (!ms) return ""; const d = new Date(ms); return d.toLocaleTimeString("bn-IN", { hour: "numeric", minute: "2-digit" }); }
const COLORS = ["#7ef0ac", "#f5c542", "#8fd3ff", "#ff9e9e", "#d6a8ff", "#ffcf8f", "#9ff0e8", "#f7a8d8"];
const isOwnerUid = (uid) => { const m = (S.members || []).find((x) => x.uid === uid); return !!m && (m.email || "").toLowerCase() === OWNER_EMAIL.toLowerCase(); };
function avatar(name, uid) {
  if (uid && isOwnerUid(uid)) return h("img", { class: "crest", src: OWNER_CREST, alt: "Owner" });
  let n = 0; for (const c of (uid || name || "x")) n = (n * 31 + c.charCodeAt(0)) >>> 0;
  return h("div", { class: "avatar", style: "background:" + COLORS[n % COLORS.length] }, (name || "?").trim().charAt(0).toUpperCase());
}
function rankBadge(i) { const r = RANKS[Math.max(0, Math.min(RANKS.length - 1, i || 0))]; return h("span", { class: "rankb", style: `background:${r.bg};color:${r.fg}` }, r.icon, " ", r.name); }
const normPhone = (p) => (p || "").replace(/\D/g, "").slice(-10);

/* ------------------------- stats ------------------------- */
function attendanceOf(m, sessions) {
  const closed = sessions.filter((s) => s.status === "closed" && (!m.joinedDate || s.date >= m.joinedDate));
  const present = closed.filter((s) => s.present && s.present[m.uid]).length;
  return { total: closed.length, present, pct: closed.length ? Math.round((present / closed.length) * 100) : 0 };
}
function isShamed(m, sessions) { const a = attendanceOf(m, sessions); return a.total >= SHAME_MIN_SESSIONS && a.pct < SHAME_BELOW_PCT; }
function weekResults(wk, members, sessions) {
  const ws = sessions.filter((s) => s.status === "closed" && s.week === wk);
  const rows = members.map((m) => {
    const mine = ws.filter((s) => !m.joinedDate || s.date >= m.joinedDate);
    const p = mine.filter((s) => s.present && s.present[m.uid]).length;
    const pct = mine.length ? Math.round((p / mine.length) * 100) : 0;
    return { uid: m.uid, name: m.name, present: p, total: mine.length, pct, coins: mine.length ? coinsForPct(pct) : 0, mvp: false };
  });
  const best = Math.max(0, ...rows.map((r) => r.present));
  if (best > 0) rows.forEach((r) => { if (r.present === best) { r.mvp = true; r.coins += MVP_BONUS; } });
  return { sessions: ws.length, rows };
}

const DEMO = !firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith("PASTE");

async function makeFirebaseAPI() {
  const V = "10.12.2";
  const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const A = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
  const F = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const app = initializeApp(firebaseConfig);
  const auth = A.getAuth(app);
  const db = F.getFirestore(app);
  const ts = (x) => (x && x.toMillis ? x.toMillis() : x || 0);
  const api = {
    demo: false,
    user: null,
    onAuth(cb) { A.onAuthStateChanged(auth, (u) => { api.user = u ? { uid: u.uid, email: (u.email || "").toLowerCase(), phone: u.phoneNumber || "" } : null; cb(api.user); }); },
    isOwner() { return !!api.user && api.user.email === OWNER_EMAIL.toLowerCase(); },
    async googleLogin() {
      const p = new A.GoogleAuthProvider();
      try { await A.signInWithPopup(auth, p); }
      catch (e) { if (String(e.code).includes("popup")) await A.signInWithRedirect(auth, p); else throw e; }
    },
    async phoneStart(phone) {
      if (!api._rv) api._rv = new A.RecaptchaVerifier(auth, "recaptcha", { size: "invisible" });
      api._conf = await A.signInWithPhoneNumber(auth, phone, api._rv);
    },
    async phoneVerify(code) { await api._conf.confirm(code); },
    logout() { return A.signOut(auth); },

    async penalize(fid, list) {

    deleteMessage(cid, mid) { return F.deleteDoc(F.doc(db, "chats", "team", "messages", mid)); },
  };
  return api;
}

function keepInputs(fn) {
  const kept = {};
  document.querySelectorAll("[data-keep]").forEach((el) => { kept[el.dataset.keep] = el.type === "checkbox" ? el.checked : el.value; });
  const active = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.keep : null;
  fn();
  document.querySelectorAll("[data-keep]").forEach((el) => {
    if (el.dataset.keep in kept) { if (el.type === "checkbox") el.checked = kept[el.dataset.keep]; else el.value = kept[el.dataset.keep]; }
  });
  if (active) { const el = document.querySelector(`[data-keep="${active}"]`); if (el) el.focus(); }
}

function render() {
  keepInputs(() => {
    const main = $("#main");
    main.replaceChildren();
    $("#tabs").hidden = S.phase !== "app";
    if (S.phase === "loading") { main.append(h("div", { class: "loader" }, "লোড হচ্ছে…")); return; }
    if (S.phase === "login") { main.append(viewLogin()); return; }
    if (S.phase === "register") { main.append(viewRegister()); return; }

    main.append(v());
    if (S.tab === "chat" && S.chat) { const box = $("#msgs"); if (box) box.scrollTop = box.scrollHeight; }

  renderModal();
}

    !f.penalized && !over && mine ? h("div", { style: "margin-top:12px;padding:10px;border-radius:12px;background:#3a1212;border:1px solid #6a2020;color:#ffc9c9;font-size:14px" },
      "⚠️ ", fmtDate(f.dueDate), "-এর মধ্যে টাকা না দিলে তোমার coins ৫০% কমে যাবে!") : null,
    f.qr ? h("div", { class: "center", style: "margin-top:12px" }, h("img", { src: f.qr, alt: "Payment QR", style: "width:min(260px,80%);border-radius:14px;background:#fff;padding:8px" }),
      h("div", { class: "muted", style: "margin-top:4px" }, "GPay / PhonePe / Paytm দিয়ে scan করে টাকা পাঠাও")) : null,
    f.upi ? h("div", { class: "row", style: "margin-top:8px;justify-content:center;flex-wrap:wrap" },
      h("span", { class: "chip" }, "UPI: ", f.upi),
      h("a", { class: "btn ghost sm", href: upiLink, style: "text-decoration:none" }, "📱 UPI app খোলো"),
      h("button", { class: "btn ghost sm", onclick: async () => { try { await navigator.clipboard.writeText(f.upi); toast("UPI ID কপি হয়েছে"); } catch { toast("কপি হলো না, হাতে লিখে নাও"); } } }, "কপি")) : null,
    mine && !f.penalized ? (my && my.state === "ok"
      ? h("p", { style: "margin:12px 0 0;color:#9df3bd;font-weight:700" }, "✅ তোমার ₹", bn(my.amount), " পাওয়া গেছে। ধন্যবাদ!")
      : h("div", { style: "margin-top:12px" },
          my && my.state === "pending" ? h("p", { style: "margin:0 0 8px;color:#ffe08a" }, "⏳ তুমি ₹", bn(my.amount), " দিয়েছ বলেছ। Owner যাচাই করছে।") : null,
          my && my.state === "no" ? h("p", { style: "margin:0 0 8px;color:#ffb4a8" }, "⚠️ Owner তোমার টাকা পায়নি। আবার দেখে জানাও।") : null,
          h("label", { class: "f" }, "কত টাকা দিলে (₹", bn(f.min), "–₹", bn(f.max), ")"),
          h("div", { class: "row" }, [f.min, Math.round((f.min + f.max) / 2), f.max].filter((v, i, a) => a.indexOf(v) === i).map((v) =>
            h("button", { class: "btn ghost sm", onclick: () => { const i = $("#amt_" + f.id); if (i) i.value = v; } }, "₹" + bn(v)))),
          h("input", { class: "in", id: "amt_" + f.id, "data-keep": "amt_" + f.id, type: "number", min: f.min, max: f.max, value: my ? my.amount : f.min, style: "margin-top:8px" }),
          h("input", { class: "in", id: "ref_" + f.id, "data-keep": "ref_" + f.id, placeholder: "Transaction ID-র শেষ ৪ অঙ্ক (ঐচ্ছিক)", maxlength: 30, style: "margin-top:8px" }),
          h("button", { class: "btn gold block", style: "margin-top:8px", onclick: async (e) => {
            const a = Number($("#amt_" + f.id).value);
            if (!(a >= f.min && a <= f.max)) return toast(`₹${bn(f.min)} থেকে ₹${bn(f.max)}-এর মধ্যে দিতে হবে`);
            e.target.disabled = true;
            try { await api.pay(f.id, a, $("#ref_" + f.id).value.trim().slice(0, 30)); toast("জানানো হয়েছে। Owner যাচাই করবে ✅"); } catch (err) { toast(err.message); e.target.disabled = false; }
          } }, "💸 আমি টাকা দিয়েছি"))) : null,
    h("div", { style: "margin-top:12px" }, fundEligible(f).map((m) => payChip(f, m))),
    owner ? ownerFundTools(f, st, over) : null);
}
function ownerFundTools(f, st, over) {
  const pays = f.pays || {};
  return h("div", { style: "margin-top:14px;border-top:1px dashed var(--line);padding-top:12px" },
    h("b", null, "⚙️ Owner"),
    st.pending.length ? h("div", null, h("div", { class: "muted", style: "margin:6px 0" }, "যাচাই বাকি:"),
      st.pending.map((u) => h("div", { class: "check" }, avatar(nameOf(u), u),
        h("div", { style: "flex:1" }, h("div", null, nameOf(u), " · ₹", bn(pays[u].amount)), h("div", { class: "muted", style: "font-size:12px" }, "Ref: ", pays[u].ref || "—")),
        h("button", { class: "btn sm", onclick: () => api.verifyPay(f.id, u, "ok").catch((e) => toast(e.message)) }, "✅ পেয়েছি"),
        h("button", { class: "btn red sm", onclick: () => api.verifyPay(f.id, u, "no").catch((e) => toast(e.message)) }, "❌")))) : h("p", { class: "muted" }, "যাচাইয়ের জন্য কেউ বাকি নেই।"),
    !f.penalized && st.unpaid.length ? h("details", { style: "margin-top:8px" }, h("summary", { class: "muted" }, "নগদে কেউ দিলে এখানে টিক দাও"),
      st.unpaid.map((m) => h("div", { class: "check" }, h("span", { style: "flex:1" }, m.name),
        h("button", { class: "btn ghost sm", onclick: () => api.markPaidCash(f.id, m.uid, f.min).catch((e) => toast(e.message)) }, "₹", bn(f.min), " নগদ পেয়েছি")))) : null,
    f.penalized
      ? h("p", { class: "muted" }, "জরিমানা দেওয়া হয়ে গেছে: ", (f.penalizedUids || []).length ? f.penalizedUids.map(nameOf).join(", ") : "কেউ না 🎉")
      : over
        ? h("button", { class: "btn red block", style: "margin-top:10px", disabled: !!st.pending.length, onclick: async (e) => {
            const list = st.unpaid.map((m) => ({ uid: m.uid, name: m.name, newCoins: Math.floor((m.coins || 0) * (1 - UNPAID_CUT)) }));
            if (!(await askConfirm(list.length ? "এদের coins ৫০% কাটা হবে: " + list.map((x) => x.name).join(", ") + "। নিশ্চিত?" : "সবাই টাকা দিয়েছে! ফান্ড বন্ধ করবে?"))) return;
            e.target.disabled = true;
            try { await api.penalize(f.id, list); toast(list.length ? "💸 জরিমানা দেওয়া হয়েছে" : "ফান্ড বন্ধ হলো"); } catch (err) { toast(err.message); e.target.disabled = false; }
          } }, st.pending.length ? "আগে বাকি payment যাচাই করো" : `💸 না-দেওয়া ${bn(st.unpaid.length)} জনের coins ৫০% কাটো`)
        : h("p", { class: "muted", style: "margin:8px 0 0" }, "শেষ তারিখ পার হলে এখানে জরিমানার বোতাম আসবে।"),
    h("button", { class: "btn ghost sm", style: "margin-top:10px", onclick: async () => { if (await askConfirm("এই ফান্ড মুছে দেবে?")) api.deleteFund(f.id).catch((e) => toast(e.message)); } }, "🗑️ ফান্ড মুছে দাও"));
}
function newFundCard() {
  let qr = S.newQR || "";
  return h("details", { class: "card", open: S.fundFormOpen || null, ontoggle: (e) => { S.fundFormOpen = e.target.open; } },
    h("summary", { style: "font-weight:700;font-size:17px;cursor:pointer" }, "➕ নতুন বল ফান্ড খোলো (owner)"),
    h("div", { style: "height:8px" }),
    h("input", { class: "in", id: "fTitle", "data-keep": "fTitle", placeholder: "যেমন: নতুন লেদার বল", value: "" }),
    h("label", { class: "f" }, "শেষ তারিখ"),
    h("input", { class: "in", id: "fDue", "data-keep": "fDue", type: "date", value: addDays(todayStr(), 3) }),
    h("div", { class: "row" },
      h("div", { style: "flex:1" }, h("label", { class: "f" }, "কমপক্ষে ₹"), h("input", { class: "in", id: "fMin", "data-keep": "fMin", type: "number", value: 10 })),
      h("div", { style: "flex:1" }, h("label", { class: "f" }, "সর্বোচ্চ ₹"), h("input", { class: "in", id: "fMax", "data-keep": "fMax", type: "number", value: 30 }))),
    h("label", { class: "f" }, "তোমার UPI QR code-এর ছবি (GPay/PhonePe থেকে screenshot)"),
    h("input", { class: "in", type: "file", accept: "image/*", onchange: async (e) => {
      const file = e.target.files[0]; if (!file) return;
      try { S.newQR = await imageToDataURL(file); render(); toast("QR যোগ হয়েছে"); } catch { toast("ছবিটা পড়া গেল না"); }
    } }),
    qr ? h("div", { class: "center", style: "margin-top:8px" }, h("img", { src: qr, style: "width:140px;border-radius:10px;background:#fff;padding:4px" })) : null,
    h("label", { class: "f" }, "UPI ID (ঐচ্ছিক, যেমন 98xxxxxx@ybl)"),
    h("input", { class: "in", id: "fUpi", "data-keep": "fUpi", placeholder: "name@upi" }),
    h("button", { class: "btn gold block", style: "margin-top:12px", onclick: async (e) => {
      const d = { title: $("#fTitle").value.trim() || "বল কেনার চাঁদা", dueDate: $("#fDue").value, min: Number($("#fMin").value), max: Number($("#fMax").value), upi: $("#fUpi").value.trim(), qr: S.newQR || "" };
      if (!d.dueDate) return toast("শেষ তারিখ দাও");
      if (!(d.min >= 1 && d.max >= d.min && d.max <= 10000)) return toast("টাকার পরিমাণ ঠিক করো");
      if (!d.qr && !d.upi) return toast("QR ছবি বা UPI ID, অন্তত একটা দাও");
      e.target.disabled = true;
      try { await api.createFund(d); S.newQR = ""; $("#fTitle").value = ""; toast("ফান্ড চালু হয়েছে 💰"); } catch (err) { toast(err.message); }
      e.target.disabled = false;
    } }, "💰 ফান্ড চালু করো"));
}
function viewFund() {
  const active = S.funds.filter((f) => !f.penalized);
  const old = S.funds.filter((f) => f.penalized);
  return h("div", null,
    api.isOwner() ? newFundCard() : null,
    h("h3", { style: "margin:4px 4px 10px" }, "💰 বল কেনার চাঁদা"),
    active.length ? active.map(fundCard) : h("div", { class: "card muted" }, "এখন কোনো চাঁদা চলছে না।"),
    old.length ? h("h3", { style: "margin:16px 4px 10px" }, "📜 আগের ফান্ড") : null,
    old.map(fundCard));
}

/* ---------- me ---------- */
function viewMe() {
  return h("div", null, viewRegister(true),
    h("div", { class: "card" }, h("div", { class: "muted" }, "Login: ", api.user.email || api.user.phone || "-"),
      h("button", { class: "btn red block", style: "margin-top:10px", onclick: () => api.logout() }, "Logout")));
}

/* ---------- boot ---------- */
async function boot() {
  try { api = DEMO ? makeDemoAPI() : await makeFirebaseAPI(); }
  catch (e) { $("#main").replaceChildren(h("div", { class: "card" }, "Firebase লোড হয়নি। ইন্টারনেট চেক করুন। (", e.message, ")")); return; }
  $("#hdrLogo").src = LOGO; $("#favi").href = LOGO; $("#favi2").href = LOGO;
  if (DEMO) { $("#demoPill").hidden = false; }
  api.onAuth((u) => {
    unsubs.forEach((f) => f && f()); unsubs = []; closeChat();
    S.me = null; S.members = []; S.sessions = []; S.funds = []; S.weeks = {};
    if (!u) { S.phase = "login"; render(); return; }
    S.phase = "loading"; render();
    unsubs.push(api.onMyMember((m) => {
      const was = S.me;
      S.me = m;
      if (!m) { S.phase = "register"; render(); return; }
      if (!was) {
        S.phase = "app";
        unsubs.push(api.onMembers((x) => { S.members = x; const mine = x.find((y) => y.uid === api.user.uid); if (mine) S.me = mine; render(); }));
        unsubs.push(api.onSessions((x) => { S.sessions = x; render(); }));
        unsubs.push(api.onWeeks((x) => { S.weeks = x; if (S.tab === "owner") render(); }));
        unsubs.push(api.onFunds((x) => { S.funds = x; if (S.tab === "fund" || S.tab === "team") render(); }));
      }
      render();
    }));
  });
}
boot();
window.__S = S;
</script>

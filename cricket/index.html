await F.setDoc(ref, { ...data, host: net.uid, guest: null, created: Date.now() });
return code;
}
throw new Error("Could not create a room, try again");
},
async getRoom(code) { const s = await F.getDoc(F.doc(db, "rooms", code)); return s.exists() ? s.data() : null; },
async update(code, patch) { await F.updateDoc(F.doc(db, "rooms", code), patch); },
watchRoom(code, cb) { return F.onSnapshot(F.doc(db, "rooms", code), (s) => cb(s.exists() ? s.data() : null), (e) => onlineError(e)); },
async sendEv(code, id, ev) { await F.setDoc(F.doc(db, "rooms", code, "ev", id), { ...ev, by: net.uid }); },
watchEv(code, cb) {
const q = F.query(F.collection(db, "rooms", code, "ev"), F.orderBy(F.documentId()));
return F.onSnapshot(q, (s) => s.docChanges().forEach((ch) => { if (ch.type === "added") cb(ch.doc.data(), ch.doc.id); }), (e) => onlineError(e));
},
};
return net;
}
const LOCALNET = location.protocol === "file:" || /localnet/.test(location.hash);
let NET = null;

let ON = null; // { code, me, room, offRoom, offEv, queue, count, started }
let OS = { overs: 5, stad: "samner", code: "" };

function myTeamForOnline() {

ACT.online = () => {
if (!SAVE.team) return ACT.team();

<div class="card"><div class="th">Create a room</div>

<label class="lbl">Stadium</label><div class="stads">${STADIUMS.map((s) => `<button class="stad ${OS.stad === s.id ? "on" : ""}" data-a="ostad" data-v="${s.id}" style="background:linear-gradient(180deg,${s.sky[0]},${s.sky[1]} 55%,${s.grass[1]} 56%)">${s.name}</button>`).join("")}</div>
<button class="btn big gold mt" data-a="ocreate">➕ Create Room</button></div>
<div class="card mt"><div class="th">Join a friend's room</div>

<button class="btn big mt" data-a="ojoin">🔑 Join Room</button></div>
<p class="muted xs" id="ostat"></p></div>`);
};
ACT.oov = (v) => { OS.overs = +v; ACT.online(); };
ACT.ostad = (v) => { OS.stad = v; ACT.online(); };
function ostat(t) { const el = document.getElementById("ostat"); if (el) el.textContent = t; }
function busy(on) { document.querySelectorAll("[data-a=ocreate],[data-a=ojoin]").forEach((b) => (b.disabled = on)); }
ACT.ocreate = async () => {
busy(true); ostat("Connecting…");
try {
const N = net(); await N.init();
const code = await N.createRoom({ v: 1, overs: OS.overs, stad: OS.stad, hostTeam: myTeamForOnline(), state: "wait" });
enterRoom(code, 0);
} catch (e) { busy(false); ostat(""); onlineError(e); }
};
ACT.ojoin = async () => {
const code = (document.getElementById("ocode").value || "").trim().toUpperCase(); OS.code = code;
if (code.length !== 4) return toast("Enter the 4-letter room code");
busy(true); ostat("Connecting…");
try {
const N = net(); await N.init();
const r = await N.getRoom(code);
if (!r) throw new Error("Room not found");
if (r.host === N.uid) return enterRoom(code, 0);
if (r.guest && r.guest !== N.uid) throw new Error("Room is full");
if (r.state === "done") throw new Error("That match is over");
const team = myTeamForOnline();
if (team.kit === r.hostTeam.kit) team.kit = Object.keys(KITS).find((k) => k !== r.hostTeam.kit);
if (!r.guest) await N.update(code, { guest: N.uid, guestTeam: team, state: "toss" });
enterRoom(code, 1);
} catch (e) { busy(false); ostat(""); toast(e.message && e.message.length < 40 ? e.message : "Could not join"); console.error(e); }
};
function enterRoom(code, me) {
leaveRoomListeners();
ON = { code, me, room: null, queue: [], count: 0, started: false, ended: false };
const N = net();
ON.offRoom = N.watchRoom(code, (r) => { if (!ON || ON.code !== code) return; ON.room = r; roomChanged(); });
ON.offEv = N.watchEv(code, (ev, id) => onEvent(ev, id));
}
function leaveRoomListeners() { if (ON) { try { ON.offRoom && ON.offRoom(); ON.offEv && ON.offEv(); } catch (e) {} } }
function oppName() { const r = ON.room; const t = ON.me === 0 ? r.guestTeam : r.hostTeam; return t ? t.name : "Friend"; }
function amHost() { return ON.me === 0; }
function roomChanged() {
const r = ON.room;
if (!r) { toast("Room closed"); return onlineHome(); }
if (ON.started) return;
if (r.state === "wait") return lobbyScreen();
if (r.state === "toss" || r.state === "choose") return onlineToss();
if (r.state === "play") return onlineStart();
}
function lobbyScreen() {
const r = ON.room;
show(`<div class="screen center"><div class="bar"><button class="btn sm ghost" data-a="oleave">← Leave</button><b>Room</b><span></span></div>
<p class="muted">Share this code with your friend</p>
<div class="roomcode">${ON.code}</div>
<button class="btn" data-a="ocopy">📋 Copy code</button>
<p class="muted">${r.overs} overs · ${esc(STADIUMS.find((s) => s.id === r.stad).name)}</p>
<div class="card"><div class="spin"></div> Waiting for your friend to join…</div>
<p class="muted xs">Friend: open the game → 🌐 Online Match → enter <b>${ON.code}</b> → Join Room</p></div>`);
}
ACT.ocopy = () => { try { navigator.clipboard.writeText(ON.code); toast("Code copied"); } catch (e) { toast(ON.code); } };
function onlineToss() {
const r = ON.room, A = r.hostTeam, B = r.guestTeam;
SC.stad = STADIUMS.find((s) => s.id === r.stad);
const vs = `<div class="vs">${kitDot(A.kit)} <b>${esc(A.name)}</b><br><span class="muted">vs</span><br>${kitDot(B.kit)} <b>${esc(B.name)}</b></div>`;
let body = "";
if (!r.call) body = ON.me === 1 ? `<p>Your call!</p><div class="row2"><button class="btn big" data-a="ocall" data-v="H">Heads</button><button class="btn big" data-a="ocall" data-v="T">Tails</button></div>` : `<p class="muted">Waiting for ${esc(B.name)} to call the toss…</p>`;
else if (!r.coin) body = `<p class="muted">${esc(B.name)} called ${r.call === "H" ? "Heads" : "Tails"}…</p>`;
else {
const W = r.tossWin === 0 ? A : B;
body = `<p class="big-t">${r.coin === "H" ? "Heads" : "Tails"}! <b>${esc(W.name)}</b> won the toss</p>` +
(r.tossWin === ON.me ? `<div class="row2"><button class="btn big gold" data-a="ochoose" data-v="bat">🏏 Bat first</button><button class="btn big" data-a="ochoose" data-v="bowl">🎯 Bowl first</button></div>` : `<p class="muted">Waiting for ${esc(W.name)} to choose…</p>`);
}
show(`<div class="screen center"><div class="bar"><button class="btn sm ghost" data-a="oleave">← Leave</button><b>Room ${ON.code}</b><span></span></div><h2>🪙 Toss</h2>${vs}
<div class="coin ${r.call && !r.coin ? "flip" : ""}">${r.coin || "?"}</div>${body}</div>`);
if (amHost() && r.call && !r.coin && !ON.flipping) {
ON.flipping = true;
setTimeout(() => { const coin = Math.random() < 0.5 ? "H" : "T"; net().update(ON.code, { coin, tossWin: coin === r.call ? 1 : 0, state: "choose" }).catch(onlineError); }, 1200);
}
}
ACT.ocall = (v) => { document.querySelectorAll("[data-a=ocall]").forEach((b) => (b.disabled = true)); net().update(ON.code, { call: v }).catch(onlineError); };
ACT.ochoose = (v) => {
document.querySelectorAll("[data-a=ochoose]").forEach((b) => (b.disabled = true));
const r = ON.room; const batFirst = v === "bat" ? r.tossWin : 1 - r.tossWin;
net().update(ON.code, { batFirst, state: "play" }).catch(onlineError);
};
function onlineStart() {
const r = ON.room; ON.started = true;
const mk = (t, i) => ({ name: t.name, kit: t.kit, xi: t.xi.slice(), squad: t.squad.slice(), human: i === ON.me, record: i === ON.me, ctl: i === ON.me ? "You" : t.name });
const teams = [mk(r.hostTeam, 0), mk(r.guestTeam, 1)];
const M = { overs: r.overs, teams, inns: [], mode: "online", stad: r.stad };
M.inns.push(newInnings(M, r.batFirst, null));
G = { M, inn: M.inns[0], phase: "idle", online: { me: ON.me, code: ON.code } };
SC.stad = STADIUMS.find((s) => s.id === r.stad);
show(""); toast(`${teams[r.batFirst].name} bat first`); beginBall();
}
function onEvent(ev, id) {

function onlineWant(t) { G.want = t; pump(); }

function onlineSend(ev) {

function waitMsg(t) { setCtrl(`<div class="cp"><div class="who">⏳ ${t}</div><div class="spin sm"></div></div>`); }

G.phase = "pickBowler";

function onlineFinished() { if (ON) { ON.ended = true; if (amHost()) net().update(ON.code, { state: "done" }).catch(() => {}); } }
function onlineHome() { leaveRoomListeners(); ON = null; G = null; home(); }
ACT.oleave = () => {

ACT.oquit = () => {

};

let INSTALL = null;

<title>Polta Titans Cricket</title>
<style>
:root { --gold: #ffc61a; --ink: #f8fafc; --muted: #9fb3d9; --line: rgba(120,170,255,.28); --navy: #0b1d4a; --navy2: #06122f; --blue: #1d5be0; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; min-width: 0; }

.btn { position: relative; overflow: hidden; border-radius: 12px; padding: 8px 12px; font: 800 13.5px system-ui, Arial; color: #fff; background: linear-gradient(180deg, #2f5fcf, #183b93); border: 2px solid rgba(160,200,255,.45); cursor: pointer; min-height: 38px; box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 3px 0 #0a1f52, 0 6px 12px rgba(0,0,0,.35); transition: transform .08s, filter .15s; text-shadow: 0 1px 0 rgba(0,0,0,.35); }

.role-BAT { background: #f59e0b; color: #1f1300; } .role-AR { background: #8b5cf6; } .role-BOWL-AR { background: #8b5cf6; } .role-SPIN { background: #0ea5e9; } .role-FAST { background: #22c55e; color: #052e12; }

.big-t { font-size: 15px; margin: 8px 0; }

.xp { height: 5px; background: rgba(0,0,0,.4); border-radius: 99px; overflow: hidden; margin: 4px 0; } .xp i { display: block; height: 100%; background: linear-gradient(90deg, #22c55e, var(--gold)); }

.slist { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; }

<div class="card mt" style="text-align:left">${[0, 1, 2, 3].map((i) => `<div style="padding:7px 2px;border-bottom:1px solid #ffffff12">${i + 1}. ${pl(i)}${i === 0 ? " <span class='lv'>HOST</span>" : ""}</div>`).join("")}</div>
<p class="muted xs">${r.overs} overs · ${esc((STADIUMS.find((s) => s.id === r.stad) || {}).name || "")}</p>
${tnIsHost() ? `<button class="btn big gold" data-a="tnstart" ${P.length === 4 ? "" : "disabled"}>${P.length === 4 ? "▶ Start Tournament" : `Waiting for players (${P.length}/4)`}</button>` : `<div class="card"><div class="spin"></div> Waiting for the host to start (${P.length}/4)</div>`}`;
} else {
